repos:
  - repo: local
    hooks:
      - id: format
        name: Format C code
        entry: clang-format -i
        language: system
        files: '\.(c|h)$'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json
      exclude: ^\.(devcontainer|vscode)/ # JSON with comments
