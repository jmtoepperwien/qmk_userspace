draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0
    rel_y: 4
    rel_w: 12
    rel_h: 12
    rx: 4
    ry: 4
  svg_extra_style: |
    .trans { opacity: 0.4; }
  footer_text: ''
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: $$tabler:stack-push$$
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AltGr
    left_gui: Cmd
    right_gui: Cmd
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    # Custom keycodes
    ANY(CK_AE): ä
    ANY(CK_OE): ö
    ANY(CK_UE): ü
    ANY(CK_SS): ß
    ANY(CK_EURO): €
    ANY(UML_CW): CWord
    ANY(SELECT_WORD): '$$tabler:brackets-contain$$'
    ANY(GAMING): Game
    ANY(GAMING_QWERTY): Game-QW
    ANY(GAMING_SCII): Game-SC2
    ANY(GAMING_FPS): Game-FPS
    ANY(GAMING_NAVNUM): Game-Nav
    # Trackball keymap
    ANY(DRAG_SCROLL): Drag
    MS_BTN1: '$$tabler:point$$'
    MS_BTN3: '$$tabler:point$$'
    MS_BTN2: '$$tabler:point$$'
    MS_BTN4: '$$tabler:point$$'
    MS_BTN5: '$$tabler:point$$'
    ANY(QK_MOUSE_BUTTON_1): '$$tabler:point$$'
    ANY(QK_MOUSE_BUTTON_2): '$$tabler:point$$'
    ANY(QK_MOUSE_BUTTON_3): '$$tabler:point$$'
    ANY(QK_MOUSE_BUTTON_4): '$$tabler:point$$'
    ANY(QK_MOUSE_BUTTON_5): '$$tabler:point$$'
    # Generic symbols
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    QUESTION: '?'
    QUES: '?'
    SPC: '$$tabler:space$$'
    BSPC: '$$tabler:backspace$$'
    APP: Menu
    UP: '$$tabler:arrow-narrow-up$$'
    DOWN: '$$tabler:arrow-narrow-down$$'
    LEFT: '$$tabler:arrow-narrow-left$$'
    RGHT: '$$tabler:arrow-narrow-right$$'
    PGUP: PgUp
    PGDN: PgDn
    HOME: '$$tabler:home$$'
    END: End
    MUTE: '$$tabler:volume-3$$'
    VOLD: '$$tabler:volume-2$$'
    VOLU: '$$tabler:volume$$'
    MPRV: '$$tabler:player-track-prev$$'
    MPLY: '$$tabler:player-play$$'
    MNXT: '$$tabler:player-track-next$$'
    PSCR: '$$tabler:screenshot$$'
    CAPS: Caps
    CW_TOGG: '$$tabler:letter-case-upper$$'
    ANY(QK_CAPS_WORD_TOGGLE): CWord
    ANY(QK_BOOT): Boot
    ANY(QK_LLCK): '$$tabler:lock$$'
    RM_TOGG: '$$tabler:bulb$$'
    RM_NEXT: '$$tabler:bounce-right$$'
    RM_PREV: '$$tabler:bounce-left$$'
    RM_HUEU: '$$tabler:palette$$'
    RM_HUED: '$$tabler:palette-off$$'
    RM_SATU: 'Sat+'
    RM_SATD: 'Sat-'
    RM_VALU: 'Val+'
    RM_VALD: 'Val-'
  zmk_remove_keycode_prefix: []
  zmk_keycode_map: {}
  zmk_combos: {}
  zmk_preamble: '#define KEYMAP_DRAWER'
  zmk_additional_includes: []
